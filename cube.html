<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spinning Cube</title>
  <style>
    :root {
      --bg1: #020817;
      --bg2: #111827;
      --cube-size: 140px;
      --cube-depth: 70px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, var(--bg2), var(--bg1));
      overflow: hidden;
      font-family: Arial, sans-serif;
      perspective: 1200px;
    }

    .scene {
      position: relative;
      width: 260px;
      height: 260px;
      display: grid;
      place-items: center;
      transform-style: preserve-3d;
    }

    .cube {
      position: relative;
      width: var(--cube-size);
      height: var(--cube-size);
      transform-style: preserve-3d;
      animation: spin 8s linear infinite;
      transform: rotateX(-24deg) rotateY(32deg);
    }

    .face {
      position: absolute;
      width: var(--cube-size);
      height: var(--cube-size);
      border: 2px solid rgba(255,255,255,0.9);
      box-shadow: inset 0 0 20px rgba(255,255,255,0.12), 0 0 18px rgba(0,0,0,0.18);
      opacity: 0.96;
    }

    .front  { background: linear-gradient(135deg, #22d3ee, #2563eb); transform: translateZ(var(--cube-depth)); }
    .back   { background: linear-gradient(135deg, #a78bfa, #7c3aed); transform: rotateY(180deg) translateZ(var(--cube-depth)); }
    .right  { background: linear-gradient(135deg, #60a5fa, #1d4ed8); transform: rotateY(90deg) translateZ(var(--cube-depth)); }
    .left   { background: linear-gradient(135deg, #f472b6, #ec4899); transform: rotateY(-90deg) translateZ(var(--cube-depth)); }
    .top    { background: linear-gradient(135deg, #34d399, #16a34a); transform: rotateX(90deg) translateZ(var(--cube-depth)); }
    .bottom { background: linear-gradient(135deg, #fbbf24, #f97316); transform: rotateX(-90deg) translateZ(var(--cube-depth)); }

    @keyframes spin {
      0% { transform: rotateX(-24deg) rotateY(0deg); }
      25% { transform: rotateX(20deg) rotateY(90deg); }
      50% { transform: rotateX(-24deg) rotateY(180deg); }
      75% { transform: rotateX(20deg) rotateY(270deg); }
      100% { transform: rotateX(-24deg) rotateY(360deg); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="cube">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
  </div>
</body>
</html>
